name: Frontrow
description: >-
  FrontRow was an India-based edtech company that operated an online learning
  platform teaching extracurricular skills and hobbies — such as music, singing,
  guitar, drawing, chess and other creative pursuits — to learners through
  recorded video courses and community-driven classes. The company was backed by
  Lightspeed Venture Partners. As of the last enrichment pass the product has
  shut down: its primary domain frontrow.co.in 301-redirects to a Medium
  shutdown announcement confirming "FrontRow shut down a few months ago," and no
  developer portal, public API, documentation, or SDK surface exists. This entry
  is retained as a defunct portfolio-lead record; there are no live API artifacts
  to enrich.
